<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Official physical-style identity card for MEBARKI ASMA, Teacher at FURQAN.">
  <title>Identity Card — MEBARKI ASMA</title>

  <style>
    :root {
      /* Card Physical Standards */
      --card-aspect-ratio: 85.6 / 54;
      --card-width-mm: 85.6mm;
      --card-height-mm: 54mm;
      --card-screen-max-width: 440px;
      --card-radius: 14px;
      --card-radius-print: 3.18mm;

      /* Colour Palette */
      --bg-surface: #f4f3f7;
      --bg-page-mesh-1: #eae5ef;
      --bg-page-mesh-2: #ded6e6;
      --card-main-color: #FFFFFF;
      --card-accent-color: #C8A2C8;
      --card-accent-dark: #8c5b8c;
      --card-accent-light: #f6ecf6;
      --card-text-primary: #1f1b24;
      --card-text-secondary: #585060;
      --card-text-muted: #887e91;
      --card-border-specular: rgba(255, 255, 255, 0.9);
      --card-border-edge: rgba(200, 162, 200, 0.45);
      --card-shadow-ambient: 0 16px 36px -10px rgba(50, 30, 60, 0.18), 0 6px 14px -4px rgba(50, 30, 60, 0.1);

      /* Typography Scale */
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --text-size-name: 1.05rem;
      --text-size-title: 0.72rem;
      --text-size-label: 0.62rem;
      --text-size-body: 0.8rem;
      --touch-target-size: 44px;

      /* Motion & Physics */
      --tilt-transition-duration: 240ms;
      --tilt-transition-easing: cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-surface);
      background-image: 
        radial-gradient(at 15% 20%, var(--bg-page-mesh-1) 0px, transparent 55%),
        radial-gradient(at 85% 80%, var(--bg-page-mesh-2) 0px, transparent 60%);
      color: var(--card-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .viewport-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      perspective: 1200px;
    }

    .card-wrap {
      width: 100%;
      max-width: var(--card-screen-max-width);
      aspect-ratio: var(--card-aspect-ratio);
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform var(--tilt-transition-duration) var(--tilt-transition-easing);
    }

    .id-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-main-color);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow-ambient);
      border: 1px solid var(--card-border-edge);
      display: grid;
      grid-template-columns: 38% 62%;
      overflow: hidden;
      user-select: none;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    /* Specular rim highlight simulating beveled edge plastic */
    .id-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, var(--card-border-specular) 0%, rgba(200, 162, 200, 0.4) 45%, rgba(255, 255, 255, 0.75) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 10;
    }

    /* Subtle optical surface sheen reacting to light */
    .card-glare {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 40% 30%, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 70%);
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: 9;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    /* Decorative security background watermark pattern */
    .card-watermark {
      position: absolute;
      right: -25px;
      bottom: -25px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 24px solid rgba(200, 162, 200, 0.09);
      pointer-events: none;
      z-index: 1;
    }

    .card-left {
      position: relative;
      z-index: 2;
      background: linear-gradient(180deg, #fdfbfd 0%, #f7eff7 100%);
      border-right: 1px solid rgba(200, 162, 200, 0.25);
      padding: 1.1rem 0.9rem 0.9rem 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
    }

    .photo-container {
      position: relative;
      width: 4.2rem;
      height: 4.2rem;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      background-color: var(--card-accent-light);
      border: 1.5px solid var(--card-accent-color);
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(80, 50, 80, 0.08);
      flex-shrink: 0;
    }

    .photo-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback avatar rendered when photo is unlinked or unavailable */
    .photo-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      color: var(--card-accent-dark);
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, var(--card-accent-light) 60%, #e6d3e6 100%);
      border-radius: 50%;
    }

    .person-details {
      margin-top: auto;
      width: 100%;
    }

    .person-name {
      font-size: var(--text-size-name);
      font-weight: 800;
      line-height: 1.15;
      color: var(--card-text-primary);
      letter-spacing: -0.01em;
      word-break: break-word;
      text-transform: uppercase;
    }

    .badge-wrap {
      margin-top: 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .person-title {
      font-size: var(--text-size-title);
      font-weight: 700;
      color: var(--card-accent-dark);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .person-org {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--card-text-secondary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .card-right {
      position: relative;
      z-index: 2;
      padding: 1.1rem 1.1rem 0.8rem 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .contact-item {
      display: flex;
      flex-direction: column;
    }

    .contact-label {
      font-size: var(--text-size-label);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--card-text-muted);
      margin-bottom: 0.08rem;
    }

    .contact-value {
      font-size: var(--text-size-body);
      font-weight: 600;
      color: var(--card-text-primary);
      text-decoration: none;
      line-height: 1.25;
      display: inline-flex;
      align-items: center;
      transition: color 0.15s ease;
      word-break: break-all;
    }

    a.contact-value:hover {
      color: var(--card-accent-dark);
      text-decoration: underline;
    }

    .social-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      margin-top: 0.4rem;
      padding-top: 0.4rem;
      border-top: 1px dashed rgba(200, 162, 200, 0.4);
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: var(--touch-target-size);
      height: var(--touch-target-size);
      border-radius: 9px;
      color: var(--card-accent-dark);
      background: transparent;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.15s ease, color 0.2s ease;
    }

    .social-link:hover:not(.disabled) {
      background-color: var(--card-accent-light);
      color: #6a3d6a;
      transform: translateY(-1.5px);
    }

    .social-link.disabled {
      color: #b7b0bc;
      cursor: not-allowed;
      pointer-events: none;
    }

    .social-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2.5px solid var(--card-accent-dark);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .actions-panel {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
    }

    .btn-print {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background-color: var(--card-accent-color);
      color: #2b1f2b;
      border: 1px solid rgba(140, 91, 140, 0.3);
      padding: 0.75rem 1.6rem;
      min-height: var(--touch-target-size);
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(140, 91, 140, 0.2);
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn-print:hover {
      background-color: #baa0ba;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(140, 91, 140, 0.28);
    }

    .btn-print:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(140, 91, 140, 0.2);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      .card-wrap {
        transition: none !important;
        transform: none !important;
      }
      .social-link:hover {
        transform: none !important;
      }
      .btn-print:hover {
        transform: none !important;
      }
    }

    @media print {
      @page {
        size: 85.6mm 54mm;
        margin: 0;
      }

      html, body {
        width: 85.6mm;
        height: 54mm;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: hidden;
      }

      .no-print {
        display: none !important;
      }

      .viewport-stage {
        width: 85.6mm !important;
        height: 54mm !important;
        max-width: 85.6mm !important;
        perspective: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .card-wrap {
        width: 85.6mm !important;
        height: 54mm !important;
        max-width: 85.6mm !important;
        aspect-ratio: auto !important;
        transform: none !important;
      }

      .id-card {
        width: 85.6mm !important;
        height: 54mm !important;
        border-radius: var(--card-radius-print) !important;
        box-shadow: none !important;
        border: 0.25mm solid #d6cad6 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        overflow: hidden;
      }

      .card-glare {
        display: none !important;
      }

      .social-link {
        width: 24px !important;
        height: 24px !important;
      }
    }
  </style>
</head>

  <script>
    function handleImageFallback(imgElement) {
      if (imgElement) {
        imgElement.style.display = 'none';
      }
      const fallback = document.getElementById('avatarFallback');
      if (fallback) {
        fallback.style.display = 'flex';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('cardElement');
      const glare = document.getElementById('glareElement');
      const printBtn = document.getElementById('btnPrint');

      // Check whether user prefers reduced motion
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      // Card 3D tilt tracking
      let bounds = null;

      function updateBounds() {
        if (card) {
          bounds = card.getBoundingClientRect();
        }
      }

      function handleMouseMove(e) {
        if (prefersReducedMotion.matches || !bounds) return;

        const mouseX = e.clientX - bounds.left;
        const mouseY = e.clientY - bounds.top;

        const xPct = (mouseX / bounds.width) - 0.5;
        const yPct = (mouseY / bounds.height) - 0.5;

        // Subtle, physical tilt limit: max 7.5 degrees
        const tiltX = -(yPct * 15).toFixed(2);
        const tiltY = (xPct * 15).toFixed(2);

        card.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(10px)`;

        // Specular light position adjustment across card
        if (glare) {
          const glareX = ((mouseX / bounds.width) * 100).toFixed(1);
          const glareY = ((mouseY / bounds.height) * 100).toFixed(1);
          glare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 70%)`;
          glare.style.opacity = '1';
        }
      }

      function handleMouseLeave() {
        if (prefersReducedMotion.matches) return;
        card.style.transform = 'rotateX(0deg) rotateY(0deg) translateZ(0px)';
        if (glare) {
          glare.style.opacity = '0.85';
          glare.style.background = 'radial-gradient(circle at 40% 30%, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 70%)';
        }
      }

      if (card) {
        updateBounds();
        window.addEventListener('resize', updateBounds, { passive: true });
        window.addEventListener('scroll', updateBounds, { passive: true });

        card.addEventListener('mouseenter', updateBounds);
        card.addEventListener('mousemove', handleMouseMove);
        card.addEventListener('mouseleave', handleMouseLeave);
      }

      if (printBtn) {
        printBtn.addEventListener('click', () => {
          window.print();
        });
      }
    });
  </script>
